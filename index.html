<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>自動遮蔽 — Auto Masker</title>
<style>
  :root{
    --bg:#08090B; --panel:#101216; --panel-2:#15181D; --rule:#22262D;
    --text:#C8CDD4; --dim:#7A828D; --faint:#454C56;
    --live:#4FB3A6; --warm:#8E7BB5; --warn:#C96A5A;
    --mono: ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --sans: system-ui,-apple-system,"Segoe UI","PingFang TC","Noto Sans TC",sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);
       font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;
       display:flex;justify-content:center;padding:36px 18px 56px}
  .app{width:100%;max-width:460px;transition:opacity 1s ease}
  body.dimmed .app{opacity:.1}
  @media (prefers-reduced-motion:reduce){.app{transition:none}}

  h1{font-size:19px;font-weight:600;margin:0 0 4px;letter-spacing:.01em}
  .lede{color:var(--dim);font-size:13.5px;margin:0 0 30px}

  /* ---- The dial: one button, one ring showing the measured room ---- */
  .dial{position:relative;width:210px;height:210px;margin:0 auto 26px}
  .dial svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
  .track{fill:none;stroke:var(--rule);stroke-width:3}
  .arc{fill:none;stroke:var(--live);stroke-width:3;stroke-linecap:round;
       transition:stroke-dashoffset .8s ease, stroke .8s ease}
  #big{position:absolute;inset:26px;border-radius:50%;background:var(--panel);
       border:1px solid var(--rule);color:var(--text);font:inherit;font-size:16px;
       font-weight:600;cursor:pointer;display:flex;flex-direction:column;
       align-items:center;justify-content:center;gap:5px}
  #big:hover{border-color:#39414c}
  #big[data-on="true"]{background:#12201D;border-color:#2E4F49}
  #big .pct{font-family:var(--mono);font-size:27px;font-weight:500;color:var(--live);letter-spacing:-.02em}
  #big .cap{font-size:12.5px;font-weight:400;color:var(--dim)}

  .status{text-align:center;font-size:13.5px;color:var(--dim);min-height:44px;margin-bottom:26px}
  .status .detail{display:block;font-family:var(--mono);font-size:11.5px;color:var(--faint);margin-top:3px}

  /* ---- Strength: the only thing you normally touch ---- */
  .strength{display:flex;gap:8px;margin-bottom:14px}
  .strength button{flex:1;background:var(--panel);border:1px solid var(--rule);border-radius:8px;
    padding:11px 6px;font:inherit;font-size:14px;color:var(--dim);cursor:pointer}
  .strength button:hover{color:var(--text);border-color:#39414c}
  .strength button[aria-pressed="true"]{background:var(--panel-2);border-color:#4A4260;color:var(--text)}
  .strength small{display:block;font-size:11.5px;color:var(--faint);margin-top:2px}

  .hint{font-size:12.5px;color:var(--faint);margin:0 0 24px;text-align:center}

  /* ---- Advanced, folded away ---- */
  details{background:var(--panel);border:1px solid var(--rule);border-radius:9px;padding:0 15px}
  summary{cursor:pointer;padding:13px 0;font-size:13.5px;color:var(--dim);list-style:none}
  summary::-webkit-details-marker{display:none}
  summary::before{content:"▸ ";color:var(--faint)}
  details[open] summary::before{content:"▾ "}
  details[open] summary{border-bottom:1px solid var(--rule);margin-bottom:12px}
  .adv{padding-bottom:14px}
  .row{display:grid;grid-template-columns:104px 1fr 62px;align-items:center;gap:11px;padding:6px 0}
  .row label{font-size:13px;color:var(--dim)}
  .row output{font-family:var(--mono);font-size:12.5px;text-align:right}
  select{background:var(--panel-2);border:1px solid var(--rule);color:var(--text);
    border-radius:6px;padding:6px 8px;font:inherit;font-size:13px;width:100%}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:20px;background:transparent;cursor:pointer}
  input[type=range]::-webkit-slider-runnable-track{height:3px;background:var(--rule);border-radius:2px}
  input[type=range]::-moz-range-track{height:3px;background:var(--rule);border-radius:2px}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;
    background:var(--warm);margin-top:-5.5px;border:none}
  input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--warm);border:none}
  .opt{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--dim);padding:7px 0}
  input[type=checkbox]{accent-color:var(--dim);width:15px;height:15px}
  .opt input[type=number]{background:var(--panel-2);border:1px solid var(--rule);color:var(--text);
    border-radius:5px;padding:3px 6px;width:52px;font-family:var(--mono);font-size:12.5px}
  .adv p{font-size:12px;color:var(--faint);margin:10px 0 0}

  footer{margin-top:26px;font-size:12px;color:var(--faint);line-height:1.65}
  footer p{margin:0 0 7px}
  .warnbox{color:var(--warn)}
  :focus-visible{outline:2px solid var(--live);outline-offset:3px;border-radius:6px}
</style>
</head>
<body>
<main class="app">

<h1>自動遮蔽</h1>
<p class="lede">按一次就好。它每隔一段時間會靜音不到一秒去量房間,然後自己決定要多大聲。</p>

<div class="dial">
  <svg viewBox="0 0 210 210" aria-hidden="true">
    <circle class="track" cx="105" cy="105" r="101"></circle>
    <circle class="arc" id="arc" cx="105" cy="105" r="101"
            stroke-dasharray="634.6" stroke-dashoffset="634.6"></circle>
  </svg>
  <button id="big" data-on="false" aria-pressed="false">
    <span class="pct" id="pct">—</span>
    <span class="cap" id="cap">開始</span>
  </button>
</div>

<div class="status" id="status">尚未啟動<span class="detail" id="detail"></span></div>

<div class="strength" role="group" aria-label="遮蔽強度">
  <button data-m="light"  aria-pressed="false">輕<small>淺眠、怕吵</small></button>
  <button data-m="normal" aria-pressed="true">標準<small>多數情況</small></button>
  <button data-m="strong" aria-pressed="false">強<small>隔壁很吵</small></button>
</div>
<p class="hint">先戴好耳塞再按開始。系統音量建議先壓到 30–40%。</p>

<details>
  <summary>進階設定</summary>
  <div class="adv">
    <div class="row">
      <label for="spk">播放裝置</label>
      <select id="spk">
        <option value="220" selected>筆電喇叭</option>
        <option value="120">小型外接喇叭</option>
        <option value="60">全音域喇叭</option>
      </select>
      <output id="spkO">220 Hz</output>
    </div>
    <div class="row">
      <label for="ceil">音量上限</label>
      <input type="range" id="ceil" min="10" max="100" value="55" step="5">
      <output id="ceilO">55%</output>
    </div>
    <div class="row">
      <label for="fadeIn">淡入時間</label>
      <input type="range" id="fadeIn" min="0" max="300" value="90" step="15">
      <output id="fadeInO">1:30</output>
    </div>
    <label class="opt"><input type="checkbox" id="autoStopOn"> 自動停止:<input type="number" id="autoStopHrs" min="1" max="14" value="9"> 小時後</label>
    <label class="opt"><input type="checkbox" id="autoDim" checked> 90 秒後畫面變暗</label>
    <p>音量上限是硬性天花板,自動調節不會超過它。若量測期間的短暫靜音會吵到你,把淡入拉長沒有用——改用手動版本比較合適。</p>
  </div>
</details>

<footer>
  <p>需要麥克風權限才能自動調節。用 <span style="font-family:var(--mono)">file://</span> 直接開啟的話瀏覽器會拒絕,改用 GitHub Pages 的網址或本機 <span style="font-family:var(--mono)">http://localhost</span>。沒有麥克風時會退回固定音量模式,仍可使用。</p>
  <p class="warnbox">隔天早上若耳朵有悶脹感或嗡嗡聲,當晚把強度降一級。那個訊號不要忽略。</p>
</footer>
</main>

<script>
"use strict";
/* =====================================================================
   AUTO MASKER
   ---------------------------------------------------------------------
   The whole idea: stop asking the user to set a level, and close the
   loop with the microphone instead.

   The hard part is that the microphone hears the masker as well as the
   neighbours, so a naive loop chases its own output and runs away. The
   fix here is DUCK AND MEASURE:

     1. sample the band while playing        → P_total (masker + room)
     2. duck the output to near silence      → wait for it to settle
     3. sample again                         → P_room  (room only)
     4. restore

   With both numbers in the same arbitrary microphone units:
        P_masker ≈ P_total − P_room
   and the target is simply P_masker = P_room × margin. That makes the
   loop self-calibrating: neither the microphone's sensitivity nor the
   speaker's efficiency needs to be known.

   The duck lasts about 0.8 s and is a drop in level, not a rise, which
   is far less likely to wake anyone. Once the correction settles the
   interval stretches from 20 s to 60 s so it happens less often.

   Masking band is 200 Hz – 2 kHz: a wall low-passes the noise, and
   foam earplugs remove another 30–40 dB above 3 kHz, so that window is
   the only place where masking energy does any work.
   ===================================================================== */

const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));

const NOISE_SECONDS = 15;
const BAND_LO = 200, BAND_HI = 2000;

// Margin in dB by which the masker should sit above the room noise.
const MARGIN = { light: 1, normal: 5, strong: 9 };
let mode = "normal";

let ctx=null, running=false, startedAt=0, autoStopTimer=null, loopToken=0;
let noiseBuf=null, srcA=null, srcB=null, wLfo1=null, wLfo2=null, wDepth1=null, wDepth2=null;
let gA=null, gB=null, autoGain=null, mEnv=null, ceilGain=null;
let outHP1=null, outHP2=null, tilt=null, limiter=null;
let brownIIR=null, aTrim=null, aLP=null;
let pinkIIR=null, pinkTrim=null, bHP1=null, bHP2=null, bPeak=null, bShelf=null, bLP=null;
let micStream=null, micAnalyser=null, micBuf=null, haveMic=false;

let curGain = 0.06;             // adaptive amplitude, in the autoGain node
let quietFloor = null;          // running estimate of the room's own noise floor
let settled = 0;                // consecutive small corrections → slow the loop down

const MIN_GAIN = 0.02;
const maxGain = () => +$("ceil").value / 100;

/* ---------------- Graph ---------------- */
function makeNoiseBuffer(ac){
  const len = Math.floor(ac.sampleRate * NOISE_SECONDS);
  const buf = ac.createBuffer(2, len, ac.sampleRate);
  for (let ch=0; ch<2; ch++){
    const d = buf.getChannelData(ch);
    for (let i=0;i<len;i++) d[i] = Math.random()*2 - 1;
  }
  return buf;
}

function buildGraph(){
  ctx = new (window.AudioContext || window.webkitAudioContext)({ latencyHint:"playback" });
  noiseBuf = makeNoiseBuffer(ctx);

  autoGain = ctx.createGain(); autoGain.gain.value = 0;   // the adaptive control
  mEnv     = ctx.createGain(); mEnv.gain.value = 0;       // fade-in and the measurement duck
  ceilGain = ctx.createGain(); ceilGain.gain.value = 1;

  // Speaker protection: 24 dB/oct high-pass. Feeding a laptop driver
  // 60 Hz produces excursion and distortion, not 60 Hz.
  const hp = +$("spk").value;
  outHP1 = ctx.createBiquadFilter(); outHP1.type="highpass"; outHP1.frequency.value=hp; outHP1.Q.value=0.7071;
  outHP2 = ctx.createBiquadFilter(); outHP2.type="highpass"; outHP2.frequency.value=hp; outHP2.Q.value=0.7071;

  // Global darkening. Nothing above 3 kHz survives the earplugs, so
  // energy up there is fatigue without benefit.
  tilt = ctx.createBiquadFilter(); tilt.type="highshelf";
  tilt.frequency.value = 3000; tilt.gain.value = -7;

  limiter = ctx.createDynamicsCompressor();
  limiter.threshold.value=-6; limiter.knee.value=0; limiter.ratio.value=20;
  limiter.attack.value=0.003; limiter.release.value=0.25;

  autoGain.connect(mEnv).connect(ceilGain).connect(outHP1).connect(outHP2)
          .connect(tilt).connect(limiter).connect(ctx.destination);

  /* Layer 1 — brown noise. y[n] = 0.02·x[n] + 0.98·y[n−1] is a one-pole
     integrator, the −6 dB/oct slope of brown noise. IIR state carries
     across the buffer's loop point, so the loop is seamless. */
  brownIIR = ctx.createIIRFilter([0.02, 0], [1, -0.98]);
  aTrim = ctx.createGain(); aTrim.gain.value = 12;
  aLP = ctx.createBiquadFilter(); aLP.type="lowpass"; aLP.frequency.value=700; aLP.Q.value=0.7071;
  gA = ctx.createGain(); gA.gain.value = 0.42;              // fixed blend, no slider
  brownIIR.connect(aTrim).connect(aLP).connect(gA).connect(autoGain);

  /* Layer 2 — speech-shaped noise: pink, high-passed at 180 Hz, a
     formant hump at the focus frequency, rolled off above 3.5 kHz.
     The focus frequency is set automatically from the spectrum of the
     noise measured during the duck window. */
  pinkIIR = ctx.createIIRFilter(
    [0.049922035, -0.095993537, 0.050612699, -0.004408786],
    [1, -2.494956002, 2.017265875, -0.522189400]
  );
  pinkTrim = ctx.createGain(); pinkTrim.gain.value = 3.5;
  bHP1 = ctx.createBiquadFilter(); bHP1.type="highpass"; bHP1.frequency.value=180; bHP1.Q.value=0.7071;
  bHP2 = ctx.createBiquadFilter(); bHP2.type="highpass"; bHP2.frequency.value=180; bHP2.Q.value=0.7071;
  bPeak = ctx.createBiquadFilter(); bPeak.type="peaking"; bPeak.frequency.value=700; bPeak.Q.value=0.9; bPeak.gain.value=5;
  bShelf = ctx.createBiquadFilter(); bShelf.type="highshelf"; bShelf.frequency.value=3500; bShelf.gain.value=-8;
  bLP = ctx.createBiquadFilter(); bLP.type="lowpass"; bLP.frequency.value=7000; bLP.Q.value=0.7071;
  gB = ctx.createGain(); gB.gain.value = 1.0;
  pinkIIR.connect(pinkTrim).connect(bHP1).connect(bHP2).connect(bPeak)
         .connect(bShelf).connect(bLP).connect(gB).connect(autoGain);

  /* Two very slow LFOs at incommensurate rates keep the noise from
     settling into a static hiss the ear learns to listen past. */
  wLfo1 = ctx.createOscillator(); wLfo1.type="sine"; wLfo1.frequency.value=0.031;
  wDepth1 = ctx.createGain(); wDepth1.gain.value = 150;   // Hz, added to bPeak.frequency
  wLfo1.connect(wDepth1).connect(bPeak.frequency);
  wLfo2 = ctx.createOscillator(); wLfo2.type="sine"; wLfo2.frequency.value=0.019;
  wDepth2 = ctx.createGain(); wDepth2.gain.value = 0.14;  // added to gB.gain
  wLfo2.connect(wDepth2).connect(gB.gain);
}

function startSources(){
  srcA = ctx.createBufferSource(); srcA.buffer=noiseBuf; srcA.loop=true;
  srcA.connect(brownIIR); srcA.start(0, 0);
  srcB = ctx.createBufferSource(); srcB.buffer=noiseBuf; srcB.loop=true;
  srcB.connect(pinkIIR); srcB.start(0, NOISE_SECONDS*0.4);   // decorrelated from A
  wLfo1.start(); wLfo2.start();
}
function stopSources(){
  const t = ctx.currentTime + 0.25;
  for (const n of [srcA, srcB, wLfo1, wLfo2]){
    if (!n) continue;
    try{ n.stop(t); }catch(e){}
    n.onended = () => { try{ n.disconnect(); }catch(e){} };
  }
  srcA = srcB = null;
  wLfo1 = ctx.createOscillator(); wLfo1.type="sine"; wLfo1.frequency.value=0.031; wLfo1.connect(wDepth1);
  wLfo2 = ctx.createOscillator(); wLfo2.type="sine"; wLfo2.frequency.value=0.019; wLfo2.connect(wDepth2);
}

/* ---------------- Microphone ---------------- */
async function initMic(){
  try{
    micStream = await navigator.mediaDevices.getUserMedia({
      audio:{ echoCancellation:false, noiseSuppression:false, autoGainControl:false }
    });
    const src = ctx.createMediaStreamSource(micStream);
    micAnalyser = ctx.createAnalyser();
    micAnalyser.fftSize = 2048; micAnalyser.smoothingTimeConstant = 0.2;
    micBuf = new Float32Array(micAnalyser.frequencyBinCount);
    src.connect(micAnalyser);                    // analysis only, never to output
    haveMic = true;
  } catch(e){ haveMic = false; }
  return haveMic;
}

/* Sample band power over a window. Returns the peak of repeated reads so
   speech peaks are caught rather than averaged away, plus the spectral
   centroid used to steer the voice layer's focus frequency. */
async function sampleBand(ms){
  const binHz = ctx.sampleRate / micAnalyser.fftSize;
  const i0 = Math.max(1, Math.floor(BAND_LO/binHz)), i1 = Math.floor(BAND_HI/binHz);
  let peak = 1e-12, cWeighted = 0, cTotal = 0;
  const reads = Math.max(3, Math.round(ms/50));
  for (let r=0; r<reads; r++){
    micAnalyser.getFloatFrequencyData(micBuf);
    let p = 0, wf = 0;
    for (let i=i0; i<i1; i++){
      const lin = Math.pow(10, micBuf[i]/10);    // dB → linear power
      p += lin; wf += lin * (i*binHz);
    }
    if (p > peak){ peak = p; cWeighted = wf; cTotal = p; }
    await sleep(50);
  }
  const centroid = cTotal > 0 ? cWeighted/cTotal : 700;
  return { power: peak, centroid };
}

/* One measurement cycle. */
async function measureOnce(){
  const before = await sampleBand(250);          // masker + room

  // Duck. A drop is far less likely to wake you than a rise.
  mEnv.gain.cancelScheduledValues(ctx.currentTime);
  mEnv.gain.setTargetAtTime(0.012, ctx.currentTime, 0.05);
  await sleep(320);                              // let it settle
  const room = await sampleBand(420);            // room only
  mEnv.gain.setTargetAtTime(1, ctx.currentTime, 0.18);

  // Track the quietest room reading seen, with slow upward drift so the
  // estimate can follow a genuinely noisier night.
  quietFloor = quietFloor === null ? room.power : Math.min(quietFloor*1.04, room.power);
  const roomP = Math.max(room.power, quietFloor);

  // Isolate the masker's own contribution, then aim for room × margin.
  const maskerP = Math.max(before.power - room.power, quietFloor*0.25);
  const wanted  = roomP * Math.pow(10, MARGIN[mode]/10);
  let ratio = Math.sqrt(wanted / maskerP);       // power ratio → amplitude ratio
  ratio = Math.min(1.25, Math.max(0.80, ratio)); // ±~2 dB per cycle, never a jump

  const prev = curGain;
  curGain = Math.min(maxGain(), Math.max(MIN_GAIN, curGain * ratio));
  // Rise slowly, fall more slowly still — neither should be audible.
  autoGain.gain.setTargetAtTime(curGain, ctx.currentTime, curGain > prev ? 4 : 10);

  // Steer the voice layer to where the intruding energy actually is.
  const focus = Math.min(1600, Math.max(320, room.centroid));
  bPeak.frequency.setTargetAtTime(focus, ctx.currentTime, 30);

  const change = Math.abs(20*Math.log10(curGain/prev));
  settled = change < 0.5 ? Math.min(4, settled+1) : 0;

  const excess = 10*Math.log10(room.power / quietFloor);
  render(curGain, excess, focus);
}

async function measureLoop(token){
  await sleep(Math.max(4000, +$("fadeIn").value*1000*0.6));
  while (running && haveMic && token === loopToken){
    try { await measureOnce(); } catch(e){ /* keep the audio running regardless */ }
    // 20 s while it is still converging, 60 s once it has settled.
    const period = settled >= 3 ? 60000 : 20000;
    for (let t=0; t<period && running && token===loopToken; t+=1000) await sleep(1000);
  }
}

/* ---------------- Render ---------------- */
const CIRC = 634.6;
function render(gain, excessDb, focus){
  const pct = Math.round(gain/maxGain()*100);
  $("pct").textContent = pct + "%";
  $("arc").style.strokeDashoffset = CIRC * (1 - gain/maxGain());
  $("arc").style.stroke = pct > 88 ? "var(--warn)" : "var(--live)";

  if (!haveMic){
    $("status").firstChild.nodeValue = "固定音量模式(無麥克風)";
    $("detail").textContent = `強度 ${mode} · 上限 ${Math.round(maxGain()*100)}%`;
    return;
  }
  let msg;
  if (excessDb === undefined) msg = "量測中…";
  else if (excessDb < 2)  msg = "房間安靜,維持低檔";
  else if (excessDb < 7)  msg = "偵測到一些聲音";
  else if (excessDb < 14) msg = "隔壁在吵,已調高";
  else                    msg = "噪音偏大,已接近上限";
  $("status").firstChild.nodeValue = msg;
  $("detail").textContent = excessDb === undefined ? ""
    : `噪音 +${excessDb.toFixed(1)} dB · 重心 ${Math.round(focus)} Hz`;
}

/* ---------------- Transport ---------------- */
async function start(){
  if (!ctx) buildGraph();
  await ctx.resume();
  if (!haveMic) await initMic();
  startSources();
  running = true; startedAt = Date.now();
  settled = 0; quietFloor = null;

  curGain = haveMic ? 0.06 : ({light:0.12, normal:0.22, strong:0.36}[mode]);
  curGain = Math.min(curGain, maxGain());
  autoGain.gain.setValueAtTime(curGain, ctx.currentTime);

  const secs = +$("fadeIn").value, t = ctx.currentTime;
  mEnv.gain.cancelScheduledValues(t);
  mEnv.gain.setValueAtTime(0.0001, t);
  if (secs <= 0) mEnv.gain.setValueAtTime(1, t+0.05);
  else mEnv.gain.exponentialRampToValueAtTime(1, t+secs);

  $("big").dataset.on = "true"; $("big").setAttribute("aria-pressed","true");
  $("cap").textContent = "停止";
  render(curGain);
  if (!haveMic) $("detail").textContent = "麥克風不可用,改用固定音量";
  scheduleAutoStop();
  measureLoop(++loopToken);
}

function stop(){
  if (!ctx) return;
  loopToken++;
  mEnv.gain.cancelScheduledValues(ctx.currentTime);
  mEnv.gain.setTargetAtTime(0, ctx.currentTime, 0.06);
  setTimeout(stopSources, 260);
  clearTimeout(autoStopTimer);
  running = false;
  $("big").dataset.on = "false"; $("big").setAttribute("aria-pressed","false");
  $("cap").textContent = "開始"; $("pct").textContent = "—";
  $("arc").style.strokeDashoffset = CIRC;
  $("status").firstChild.nodeValue = "已停止";
  $("detail").textContent = "";
  document.body.classList.remove("dimmed");
}
$("big").addEventListener("click", () => running ? stop() : start());

function scheduleAutoStop(){
  clearTimeout(autoStopTimer);
  if (!$("autoStopOn").checked || !running) return;
  const hrs = Math.min(14, Math.max(1, +$("autoStopHrs").value || 9));
  autoStopTimer = setTimeout(() => {
    if (!running) return;
    loopToken++;                                  // stop measuring during the taper
    mEnv.gain.setTargetAtTime(0.0001, ctx.currentTime, 60);   // 5-minute fade
    $("status").firstChild.nodeValue = "正在漸弱停止";
    setTimeout(stop, 5*60*1000);
  }, hrs*3600*1000);
}
$("autoStopOn").addEventListener("change", scheduleAutoStop);
$("autoStopHrs").addEventListener("change", scheduleAutoStop);

/* ---------------- Controls ---------------- */
for (const b of document.querySelectorAll(".strength button")){
  b.addEventListener("click", () => {
    mode = b.dataset.m;
    for (const o of document.querySelectorAll(".strength button"))
      o.setAttribute("aria-pressed", String(o === b));
    settled = 0;                                  // re-converge on the new target
    if (running && !haveMic){
      curGain = Math.min(maxGain(), {light:0.12, normal:0.22, strong:0.36}[mode]);
      autoGain.gain.setTargetAtTime(curGain, ctx.currentTime, 3);
      render(curGain);
    }
  });
}
$("spk").addEventListener("change", () => {
  $("spkO").value = $("spk").value + " Hz";
  if (ctx){
    const f = +$("spk").value;
    outHP1.frequency.setTargetAtTime(f, ctx.currentTime, 0.3);
    outHP2.frequency.setTargetAtTime(f, ctx.currentTime, 0.3);
  }
});
$("ceil").addEventListener("input", () => {
  $("ceilO").value = $("ceil").value + "%";
  if (running){
    curGain = Math.min(curGain, maxGain());
    autoGain.gain.setTargetAtTime(curGain, ctx.currentTime, 2);
    render(curGain);
  }
});
$("fadeIn").addEventListener("input", () => {
  const s = +$("fadeIn").value;
  $("fadeInO").value = s === 0 ? "關閉" : `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;
});

/* ---------------- Night dim ---------------- */
let idleTimer=null;
function poke(){
  document.body.classList.remove("dimmed");
  clearTimeout(idleTimer);
  if (!$("autoDim").checked) return;
  idleTimer = setTimeout(() => { if (running) document.body.classList.add("dimmed"); }, 90000);
}
["pointerdown","keydown","pointermove"].forEach(e => window.addEventListener(e, poke, {passive:true}));
$("autoDim").addEventListener("change", poke);

/* ---------------- Watchdog ----------------
   Operating systems suspend audio contexts on sleep, device changes, or
   power saving. Check every 10 s and resume without touching the graph,
   so an overnight run survives a lid close or a Bluetooth reconnect. */
setInterval(() => {
  if (running && ctx && ctx.state !== "running") ctx.resume().catch(()=>{});
}, 10000);
document.addEventListener("visibilitychange", () => {
  if (!document.hidden && running && ctx && ctx.state !== "running") ctx.resume();
});
window.addEventListener("beforeunload", () => {
  if (micStream) micStream.getTracks().forEach(t => t.stop());
  if (ctx) ctx.close();
});

$("spkO").value = $("spk").value + " Hz";
$("ceilO").value = $("ceil").value + "%";
$("fadeInO").value = "1:30";
poke();
</script>
</body>
</html>
